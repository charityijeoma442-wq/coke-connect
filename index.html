
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coke Connect</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
header{background:#d60000;color:white;text-align:center;padding:20px}
nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;background:white;padding:12px;position:sticky;top:0}
button{border:0;border-radius:8px;padding:12px;background:#d60000;color:white;font-weight:bold;cursor:pointer}
nav button{background:#222}
main{max-width:900px;margin:auto;padding:16px}
.page{display:none}
.page.active{display:block}
.hero{background:#d60000;color:white;text-align:center;padding:25px;border-radius:12px;margin-bottom:20px}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card,.item{background:white;padding:14px;border-radius:12px;margin-bottom:10px;box-shadow:0 2px 5px #ddd}
.drink{font-size:55px;text-align:center;background:#fff0f0;padding:20px}
.price{color:#d60000;font-weight:bold}
.card button{width:100%}
input{width:100%;padding:13px;margin:8px 0;border:1px solid #ccc;border-radius:8px}
footer{text-align:center;padding:20px;color:#666}
@media(min-width:650px){.products{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>

<header>
<h1>🥤 Coke Connect</h1>
<p>Refresh your moment!</p>
</header>

<nav>
<button onclick="showPage('home')">Home</button>
<button onclick="showPage('shop')">Shop</button>
<button onclick="showPage('cart')">Cart (<span id="cartCount">0</span>)</button>
<button onclick="showPage('orders')">Orders</button>
<button onclick="showPage('profile')">Profile</button>
</nav>

<main>

<section id="home" class="page active">
<div class="hero">
<h2>Welcome to Coke Connect!</h2>
<p>Discover your favourite refreshments.</p>
<button onclick="showPage('shop')">Shop Now</button>
</div>
<h2>Popular Drinks</h2>
<div id="homeProducts" class="products"></div>
</section>

<section id="shop" class="page">
<h2>Our Drinks</h2>
<input id="search" placeholder="Search drinks..." oninput="searchProducts()">
<div id="shopProducts" class="products"></div>
</section>

<section id="cart" class="page">
<h2>Your Shopping Cart</h2>
<div id="cartItems"></div>
<h3 id="total">Total: ₦0</h3>
<button onclick="checkout()">Place Demo Order</button>
</section>

<section id="orders" class="page">
<h2>My Orders</h2>
<div id="orderItems"></div>
</section>

<section id="profile" class="page">
<h2>My Profile</h2>
<input id="profileName" placeholder="Your name">
<input id="profileEmail" placeholder="Your email">
<button onclick="saveProfile()">Save Profile</button>
<p id="profileMessage"></p>
<h3>My Rewards</h3>
<p id="points">0 points</p>
</section>

</main>

<footer>
<p>Coke Connect — Independent demo project.</p>
<p>Not affiliated with or endorsed by Coca-Cola.</p>
</footer>

<script>
const products=[
{id:1,name:"Coca-Cola",price:150,emoji:"🥤"},
{id:2,name:"Coca-Cola Zero",price:150,emoji:"🥤"},
{id:3,name:"Fanta",price:150,emoji:"🍊"},
{id:4,name:"Sprite",price:150,emoji:"🍋"},
{id:5,name:"Schweppes",price:200,emoji:"🧃"},
{id:6,name:"Eva Water",price:100,emoji:"💧"}
];

function loadData(key,defaultValue){
try{
const saved=localStorage.getItem(key);
return saved?JSON.parse(saved):defaultValue;
}catch(error){
return defaultValue;
}
}

let cart=loadData("cokeCart",[]);
let orders=loadData("cokeOrders",[]);
let points=loadData("cokePoints",0);
let account=loadData("cokeAccount",{name:"",email:""});

function saveData(key,value){
localStorage.setItem(key,JSON.stringify(value));
}

function money(value){
return "₦"+Number(value).toLocaleString();
}

function productCard(product){
return `
<div class="card">
<div class="drink">${product.emoji}</div>
<h3>${product.name}</h3>
<p class="price">${money(product.price)}</p>
<button type="button" onclick="addCart(${product.id})">
Add to Cart
</button>
</div>`;
}

function renderProducts(){
document.getElementById("homeProducts").innerHTML=
products.slice(0,4).map(productCard).join("");

document.getElementById("shopProducts").innerHTML=
products.map(productCard).join("");
}

function showPage(page){
document.querySelectorAll(".page").forEach(section=>{
section.classList.remove("active");
});

document.getElementById(page).classList.add("active");

if(page==="cart")renderCart();
if(page==="orders")renderOrders();
if(page==="profile")renderProfile();
}

function addCart(id){
const product=products.find(item=>item.id===Number(id));

if(!product){
alert("Product not found.");
return;
}

const existing=cart.find(item=>item.id===product.id);

if(existing){
existing.qty+=1;
}else{
cart.push({...product,qty:1});
}

saveData("cokeCart",cart);
updateCount();
renderCart();

alert(product.name+" added to cart!");
}

function updateCount(){
const count=cart.reduce((sum,item)=>sum+item.qty,0);
document.getElementById("cartCount").textContent=count;
}

function renderCart(){
const container=document.getElementById("cartItems");

if(cart.length===0){
container.innerHTML="<p>Your cart is empty. Go to Shop to add drinks.</p>";
document.getElementById("total").textContent="Total: ₦0";
return;
}

container.innerHTML=cart.map(item=>`
<div class="item">
<h3>${item.emoji} ${item.name}</h3>
<p>${money(item.price)} each</p>
<p>Quantity: ${item.qty}</p>
<button onclick="changeQty(${item.id},1)">+</button>
<button onclick="changeQty(${item.id},-1)">-</button>
<button onclick="removeItem(${item.id})">Remove</button>
<p>Subtotal: ${money(item.price*item.qty)}</p>
</div>
`).join("");

const total=cart.reduce((sum,item)=>sum+item.price*item.qty,0);
document.getElementById("total").textContent="Total: "+money(total);
}

function changeQty(id,amount){
const item=cart.find(product=>product.id===Number(id));
if(!item)return;

item.qty+=amount;

if(item.qty<=0){
cart=cart.filter(product=>product.id!==Number(id));
}

saveData("cokeCart",cart);
updateCount();
renderCart();
}

function removeItem(id){
cart=cart.filter(item=>item.id!==Number(id));
saveData("cokeCart",cart);
updateCount();
renderCart();
}

function checkout(){
if(cart.length===0){
alert("Your cart is empty!");
return;
}

const order={
id:Date.now(),
date:new Date().toLocaleString(),
items:cart.map(item=>({...item})),
total:cart.reduce((sum,item)=>sum+item.price*item.qty,0)
};

orders.unshift(order);
saveData("cokeOrders",orders);

points+=10;
saveData("cokePoints",points);

cart=[];
saveData("cokeCart",cart);

updateCount();
renderCart();

alert("Demo order placed successfully!");
showPage("orders");
}

function renderOrders(){
const container=document.getElementById("orderItems");

if(orders.length===0){
container.innerHTML="<p>You have no orders yet.</p>";
return;
}

container.innerHTML=orders.map(order=>`
<div class="item">
<h3>Order #${order.id}</h3>
<p>${order.date}</p>
<p>${order.items.map(item=>item.name+" x "+item.qty).join(", ")}</p>
<strong>${money(order.total)}</strong>
<p>Demo order</p>
</div>
`).join("");
}

function renderProfile(){
document.getElementById("profileName").value=account.name||"";
document.getElementById("profileEmail").value=account.email||"";
document.getElementById("points").textContent=points+" points";
}

function saveProfile(){
account={
name:document.getElementById("profileName").value,
email:document.getElementById("profileEmail").value
};

saveData("cokeAccount",account);
document.getElementById("profileMessage").textContent="Profile saved!";
}

function searchProducts(){
const term=document.getElementById("search").value.toLowerCase();

const filtered=products.filter(product=>
product.name.toLowerCase().includes(term)
);

document.getElementById("shopProducts").innerHTML=
filtered.map(productCard).join("");
}

renderProducts();
updateCount();
renderCart();
renderProfile();
</script>

</body>
</html>
