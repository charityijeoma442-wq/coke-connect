<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coke Connect</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f4f4f4;color:#222}
header{background:#d60000;color:white;text-align:center;padding:20px}
nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:12px;background:white}
button{border:0;padding:12px;border-radius:8px;background:#d60000;color:white;cursor:pointer}
nav button{background:#222}
main{max-width:900px;margin:auto;padding:16px}
.page{display:none}
.page.active{display:block}
.hero{background:#d60000;color:white;padding:25px;text-align:center;border-radius:12px}
input{width:100%;padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:8px}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card,.item{background:white;padding:15px;border-radius:12px;margin-bottom:10px}
.drink{text-align:center;font-size:55px;background:#fff0f0;padding:20px}
.price{color:#d60000;font-weight:bold}
.card button{width:100%}
footer{text-align:center;padding:20px}
@media(min-width:650px){.products{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header>
<h1>🥤 Coke Connect</h1>
<p>Refresh your moment!</p>
</header>

<nav>
<button data-page="home">Home</button>
<button data-page="shop">Shop</button>
<button data-page="cart">Cart (<span id="cartCount">0</span>)</button>
<button data-page="orders">Orders</button>
<button data-page="profile">Profile</button>
</nav>

<main>
<section id="home" class="page active">
<div class="hero">
<h2>Welcome to Coke Connect</h2>
<p>Discover your favourite refreshments!</p>
<button id="shopNow">Shop Now</button>
</div>
<h2>Popular Drinks</h2>
<div id="homeProducts" class="products"></div>
</section>

<section id="shop" class="page">
<h2>Shop Drinks</h2>
<input id="search" placeholder="Search drinks">
<div id="shopProducts" class="products"></div>
</section>

<section id="cart" class="page">
<h2>Your Cart</h2>
<div id="cartItems"></div>
<h3 id="total">Total: ₦0</h3>
<button id="checkout">Place Demo Order</button>
</section>

<section id="orders" class="page">
<h2>My Orders</h2>
<div id="orderItems"></div>
</section>

<section id="profile" class="page">
<h2>My Profile</h2>
<input id="profileName" placeholder="Your name">
<input id="profileEmail" placeholder="Your email">
<button id="saveProfile">Save Profile</button>
<p id="profileMessage"></p>
<h3>Rewards</h3>
<p id="points">0 points</p>
</section>
</main>

<footer>
<p>Coke Connect — Independent demo project, not affiliated with Coca-Cola.</p>
</footer>

<script>
const products=[
{id:1,name:"Coca-Cola",price:150,emoji:"🥤"},
{id:2,name:"Coca-Cola Zero",price:150,emoji:"🥤"},
{id:3,name:"Fanta",price:150,emoji:"🍊"},
{id:4,name:"Sprite",price:150,emoji:"🍋"},
{id:5,name:"Schweppes",price:200,emoji:"🧃"},
{id:6,name:"Eva Water",price:100,emoji:"💧"}
];

function getData(key,def){
try{return JSON.parse(localStorage.getItem(key))??def}
catch(e){return def}
}

let cart=getData("cokeCart",[]);
let orders=getData("cokeOrders",[]);
let points=getData("cokePoints",0);
let account=getData("cokeAccount",{name:"",email:""});

function save(key,data){
localStorage.setItem(key,JSON.stringify(data));
}

function money(n){return "₦"+n.toLocaleString()}

function productCard(p){
return `<div class="card">
<div class="drink">${p.emoji}</div>
<h3>${p.name}</h3>
<p class="price">${money(p.price)}</p>
<button data-add="${p.id}">Add to Cart</button>
</div>`;
}

function renderProducts(){
document.getElementById("homeProducts").innerHTML=products.slice(0,4).map(productCard).join("");
document.getElementById("shopProducts").innerHTML=products.map(productCard).join("");
}

function showPage(id){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.getElementById(id).classList.add("active");
if(id==="cart")renderCart();
if(id==="orders")renderOrders();
if(id==="profile")renderProfile();
}

function addCart(id){
const p=products.find(x=>x.id===Number(id));
if(!p)return;
const found=cart.find(x=>x.id===p.id);
if(found)found.qty++;
else cart.push({...p,qty:1});
save("cokeCart",cart);
renderCart();
updateCount();
alert(p.name+" added to cart!");
}

function updateCount(){
document.getElementById("cartCount").textContent=cart.reduce((s,x)=>s+x.qty,0);
}

function renderCart(){
const el=document.getElementById("cartItems");
if(cart.length===0){
el.innerHTML="<p>Your cart is empty.</p>";
document.getElementById("total").textContent="Total: ₦0";
return;
}
el.innerHTML=cart.map(x=>`<div class="item">
<h3>${x.emoji} ${x.name}</h3>
<p>${money(x.price)} × ${x.qty}</p>
<button data-plus="${x.id}">+</button>
<button data-minus="${x.id}">−</button>
<button data-remove="${x.id}">Remove</button>
</div>`).join("");
document.getElementById("total").textContent="Total: "+money(cart.reduce((s,x)=>s+x.price*x.qty,0));
}

function changeQty(id,n){
const x=cart.find(i=>i.id===Number(id));
if(!x)return;
x.qty+=n;
if(x.qty<=0)cart=cart.filter(i=>i.id!==Number(id));
save("cokeCart",cart);
renderCart();
updateCount();
}

function removeItem(id){
cart=cart.filter(x=>x.id!==Number(id));
save("cokeCart",cart);
renderCart();
updateCount();
}

function checkout(){
if(!cart.length){alert("Your cart is empty!");return;}
orders.unshift({
id:Date.now(),
date:new Date().toLocaleString(),
items:cart.map(x=>({...x})),
total:cart.reduce((s,x)=>s+x.price*x.qty,0)
});
save("cokeOrders",orders);
points+=10;
save("cokePoints",points);
cart=[];
save("cokeCart",cart);
updateCount();
alert("Demo order placed!");
showPage("orders");
}

function renderOrders(){
const el=document.getElementById("orderItems");
if(!orders.length){el.innerHTML="<p>No orders yet.</p>";return;}
el.innerHTML=orders.map(o=>`<div class="item">
<h3>Order #${o.id}</h3>
<p>${o.date}</p>
<p>${o.items.map(x=>x.name+" × "+x.qty).join(", ")}</p>
<strong>${money(o.total)}</strong>
</div>`).join("");
}

function renderProfile(){
document.getElementById("profileName").value=account.name||"";
document.getElementById("profileEmail").value=account.email||"";
document.getElementById("points").textContent=points+" points";
}

document.addEventListener("click",function(e){
const b=e.target.closest("button");
if(!b)return;
if(b.dataset.page){showPage(b.dataset.page);return;}
if(b.dataset.add){addCart(b.dataset.add);return;}
if(b.dataset.plus){changeQty(b.dataset.plus,1);return;}
if(b.dataset.minus){changeQty(b.dataset.minus,-1);return;}
if(b.dataset.remove){removeItem(b.dataset.remove);return;}
});

document.getElementById("shopNow").onclick=()=>showPage("shop");
document.getElementById("checkout").onclick=checkout;

document.getElementById("search").oninput=function(){
const term=this.value.toLowerCase();
document.getElementById("shopProducts").innerHTML=
products.filter(x=>x.name.toLowerCase().includes(term)).map(productCard).join("");
};

document.getElementById("saveProfile").onclick=function(){
account={
name:document.getElementById("profileName").value,
email:document.getElementById("profileEmail").value
};
save("cokeAccount",account);
document.getElementById("profileMessage").textContent="Profile saved!";
};

renderProducts();
updateCount();
renderCart();
renderProfile();
</script>
</body>
</html>
